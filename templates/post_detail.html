{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h3>{{ post.title }}</h3>
    <p><small>{{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</small></p>
    <div class="post-content">{{ post.content }}</div>
    <p><a href="{{ url_for('main.post_list') }}">← 返回列表</a></p>
{% endblock %}
