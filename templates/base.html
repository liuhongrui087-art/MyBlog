<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}我的博客{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <nav>
    <a href="{{ url_for('main.hello') }}" class="{{ 'active' if request.endpoint == 'main.hello' else '' }}">首页</a>
    <a href="{{ url_for('main.post_list') }}" class="{{ 'active' if request.endpoint in ['main.post_list', 'main.post_new', 'main.post_detail'] else '' }}">文章</a>
    <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' else '' }}">提交名字</a>
    <a href="{{ url_for('main.show_users') }}" class="{{ 'active' if request.endpoint == 'main.show_users' else '' }}">用户列表</a>
    <a href="{{ url_for('main.about') }}" class="{{ 'active' if request.endpoint == 'main.about' else '' }}">关于</a>
</nav>

    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
